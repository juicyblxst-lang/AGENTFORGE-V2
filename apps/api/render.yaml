services:
  - type: web
    name: agentforge-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NETWORK
        value: bsc-testnet
      - key: RPC_URL
        value: https://data-seed-prebsc-1-s1.bnbchain.org:8545
      - key: CORS_ORIGINS
        sync: false
      - key: EIGHTYFOUR_SCAN_API_KEY
        sync: false
      - key: PROVIDER_PRIVATE_KEY
        sync: false
      - key: PROVIDER_ADDRESS
        sync: false
      - key: PROVIDER_AGENT_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agentforge-db
          property: connectionString
      - key: SERVICE_PRICE_UNITS
        value: '1'
      - key: POLL_INTERVAL_SECONDS
        value: '15'
databases:
  - name: agentforge-db
    plan: free
