services:
  - type: web
    name: agentforge-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NETWORK
        value: bsc-testnet
      - key: CORS_ORIGINS
        sync: false
      - key: EIGHTYFOUR_SCAN_API_KEY
        sync: false
      - key: PROVIDER_PRIVATE_KEY
        sync: false
      - key: PROVIDER_ADDRESS
        sync: false
      - key: PROVIDER_AGENT_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
